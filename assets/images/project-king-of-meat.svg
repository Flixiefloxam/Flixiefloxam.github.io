<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">King of Meat project artwork</title>
  <desc id="desc">An original dark arena-inspired placeholder graphic with a crown, crossed implements, and the words King of Meat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1025"/>
